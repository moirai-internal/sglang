name: Build and Deploy Feature Branches

on:
  pull_request:
    branches:
      - "features-based-on-v*"
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Feature branch name to deploy"
        required: true
        type: string
      models:
        description: "Comma-separated list of model names to deploy"
        required: false
        default: "llama-3-3-70b-instruct,llama-4-scout-17b-16e-instruct"
        type: string

env:
  REGISTRY: fra.ocir.io
  REGISTRY_NAMESPACE: idqj093njucb
  K8S_NAMESPACE: github-actions
  CONTAINER_NAME: official-sgl
  CUDA_SUFFIX: cu126
  ISVC_MODELS: llama-3-3-70b-instruct,llama-4-scout-17b-16e-instruct
  BUCKET_NAME: ome-benchmark-results
  BENCHMARK_CONTAINER: ghcr.io/moirai-internal/genai-bench:0.0.1

jobs:
  build-and-deploy:

    if: startsWith(github.ref_name, 'features-based-on-v') || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # - name: Delete huge unnecessary tools folder
      #   run: rm -rf /opt/hostedtoolcache

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch_name || github.ref_name }}

      # - name: Free disk space
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: false
      #     docker-images: false
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     swap-storage: false

      - name: Extract version and commit info
        id: version_info
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH_NAME="${{ github.event.inputs.branch_name }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi

          # Extract version from branch name (features-based-on-vX.Y.Z -> vX.Y.Z)
          VERSION=$(echo "$BRANCH_NAME" | sed 's/features-based-on-//')

          # Get short commit hash
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Create full tag
          FULL_TAG="${VERSION}.${COMMIT_HASH}-${CUDA_SUFFIX}"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "full_tag=$FULL_TAG" >> $GITHUB_OUTPUT
          echo "image_name=${REGISTRY}/${REGISTRY_NAMESPACE}/${CONTAINER_NAME}" >> $GITHUB_OUTPUT

          echo "Branch: $BRANCH_NAME"
          echo "Version: $VERSION"
          echo "Commit: $COMMIT_HASH"
          echo "Full tag: $FULL_TAG"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCIR_ACCOUNT }}
          password: ${{ secrets.OCIR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: docker/Dockerfile
      #     push: true
      #     tags: |
      #       ${{ steps.version_info.outputs.image_name }}:${{ steps.version_info.outputs.full_tag }}
      #     build-args: |
      #       CUDA_VERSION=12.6.1
      #       BUILD_TYPE=all
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max
      #     platforms: linux/amd64

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.1'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify kubectl connection
        run: |
          kubectl cluster-info --namespace ${K8S_NAMESPACE}
          kubectl get nodes

      - name: Prepare model list
        id: models
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODELS="${{ github.event.inputs.models }}"
          else
            # Default models for auto-deployment
            MODELS=${ISVC_MODELS}
          fi

          # Convert comma-separated string to array and output as JSON
          IFS=',' read -ra MODEL_ARRAY <<< "$MODELS"
          MODELS_JSON=$(printf '%s\n' "${MODEL_ARRAY[@]}" | jq -R . | jq -s . | tr -d '\n')
          echo "models_json=$MODELS_JSON" >> $GITHUB_OUTPUT
          echo "Models to deploy: $MODELS"
          echo "Models JSON: $MODELS_JSON"

      - name: Deploy to Kubernetes
        run: |
          MODELS_JSON='${{ steps.models.outputs.models_json }}'
          IMAGE="${{ steps.version_info.outputs.image_name }}:${{ steps.version_info.outputs.full_tag }}"
          BRANCH_NAME="${{ steps.version_info.outputs.branch_name }}"
          VERSION="${{ steps.version_info.outputs.version }}"

          # Deploy each model sequentially
          echo "$MODELS_JSON" | jq -r '.[]' | while read -r model; do
            echo "Deploying model: $model"

            # Sanitize model name for k8s resource names
            MODEL_NAME=$(echo "$model" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            # Create namespace name following the pattern from example
            NAMESPACE=${K8S_NAMESPACE}
            NAMESPACE=$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g')
            # Ensure namespace name is valid (max 63 chars, no leading/trailing hyphens)
            NAMESPACE=$(echo "$NAMESPACE" | cut -c1-63 | sed 's/-$//')

            # Create runtime name
            RUNTIME_NAME="srt-$MODEL_NAME"
            RUNTIME_NAME=$(echo "$RUNTIME_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g')
            RUNTIME_NAME=$(echo "$RUNTIME_NAME" | cut -c1-63 | sed 's/-$//')

            echo "Namespace: $NAMESPACE"
            echo "Runtime: $RUNTIME_NAME"

            # Create InferenceService manifest
            cat <<EOF > isvc-$MODEL_NAME.yaml
          ---
          apiVersion: ome.io/v1beta1
          kind: InferenceService
          metadata:
            name: $MODEL_NAME
            namespace: $NAMESPACE
            labels:
              sglang.version: "$VERSION"
              sglang.branch: "$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')"
              sglang.model: "$MODEL_NAME"
            annotations:
              sglang.image: "$IMAGE"
              sglang.model-path: "$model"
              sglang.deployed-by: "github-actions"
              sglang.deployment-time: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          spec:
            engine:
              minReplicas: 1
              maxReplicas: 1
              runner:
                name: ome-container
                image: $IMAGE
            model:
              name: $MODEL_NAME
            runtime:
              name: $RUNTIME_NAME
          EOF

            # create benchmark job manifest
            cat <<EOF > benchmark-$MODEL_NAME.yaml
          apiVersion: ome.io/v1beta1
          kind: BenchmarkJob
          metadata:
            name: $MODEL_NAME
            namespace: $NAMESPACE
          spec:
            podOverride:
              image: ${BENCHMARK_CONTAINER}
            endpoint:
              inferenceService:
                name: benchmark-$MODEL_NAME
                namespace: $NAMESPACE
            task: text-to-text
            trafficScenarios:
              - "N(480,240)/(300,150)"
              - "D(100,100)"
              - "D(100,1000)"
              - "D(2000,200)"
              - "D(7800,200)"
            numConcurrency:
              - 1
              - 128
            maxTimePerIteration: 15
            maxRequestsPerIteration: 1000
            outputLocation:
              storageUri: "oci://n/${REGISTRY_NAMESPACE}/b/${BUCKET_NAME}/o/${CONTAINER_NAME}/${{ steps.version_info.outputs.full_tag }}/$MODEL_NAME"
              parameters:
                auth: "instance_principal"
                region: "eu-frankfurt-1"
          EOF

            # Apply the InferenceService
            kubectl apply -f isvc-$MODEL_NAME.yaml

            # Wait for InferenceService to be ready (with timeout)
            echo "Waiting for InferenceService $MODEL_NAME to be ready in namespace $NAMESPACE..."

            # Check if the InferenceService exists and wait for it to be ready
            TIMEOUT=600
            ELAPSED=0
            READY=false

            while [ $ELAPSED -lt $TIMEOUT ]; do
              # Check if InferenceService exists and get its status
              if kubectl get inferenceservice $MODEL_NAME -n $NAMESPACE >/dev/null 2>&1; then
                STATUS=$(kubectl get inferenceservice $MODEL_NAME -n $NAMESPACE -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "Unknown")
                if [ "$STATUS" = "True" ]; then
                  READY=true
                  break
                fi
                echo "InferenceService status: $STATUS (waiting...)"
              else
                echo "InferenceService not found yet (waiting...)"
              fi

              sleep 60
              ELAPSED=$((ELAPSED + 10))
            done

            if [ "$READY" = "true" ]; then
              echo "✅ Successfully deployed InferenceService for model: $model"
              echo "   Namespace: $NAMESPACE"
              echo "   InferenceService: $MODEL_NAME"
              echo "   Runtime: $RUNTIME_NAME"

              # Deploy benchmark job now that InferenceService is ready
              echo "🏃 Starting benchmark job for model: $model"
              kubectl apply -f benchmark-$MODEL_NAME.yaml

              # Wait for benchmark job to complete (with timeout)
              echo "Waiting for BenchmarkJob $MODEL_NAME to complete in namespace $NAMESPACE..."

              BENCHMARK_TIMEOUT=18000  # 5 hours
              BENCHMARK_ELAPSED=0
              BENCHMARK_SUCCESS=false

              while [ $BENCHMARK_ELAPSED -lt $BENCHMARK_TIMEOUT ]; do
                # Check if BenchmarkJob exists and get its status
                if kubectl get benchmarkjob $MODEL_NAME -n $NAMESPACE >/dev/null 2>&1; then
                  BENCHMARK_STATUS=$(kubectl get benchmarkjob $MODEL_NAME -n $NAMESPACE -o jsonpath='{.status.conditions[?(@.type=="Completed")].status}' 2>/dev/null || echo "Unknown")
                  BENCHMARK_FAILED=$(kubectl get benchmarkjob $MODEL_NAME -n $NAMESPACE -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || echo "False")

                  if [ "$BENCHMARK_STATUS" = "True" ]; then
                    BENCHMARK_SUCCESS=true
                    break
                  elif [ "$BENCHMARK_FAILED" = "True" ]; then
                    echo "❌ Benchmark job failed for model: $model"
                    kubectl get benchmarkjob $MODEL_NAME -n $NAMESPACE -o yaml
                    break
                  fi
                  echo "BenchmarkJob status: Completed=$BENCHMARK_STATUS, Failed=$BENCHMARK_FAILED (waiting...)"
                else
                  echo "BenchmarkJob not found yet (waiting...)"
                fi

                sleep 30
                BENCHMARK_ELAPSED=$((BENCHMARK_ELAPSED + 30))
              done

              if [ "$BENCHMARK_SUCCESS" = "true" ]; then
                echo "✅ Successfully completed benchmark for model: $model"
                echo "   Benchmark results should be available at: oci://n/${REGISTRY_NAMESPACE}/b/${BUCKET_NAME}/o/${CONTAINER_NAME}/${{ steps.version_info.outputs.full_tag }}/$MODEL_NAME"
              else
                echo "❌ Failed to complete benchmark or timeout for model: $model"
                echo "Checking BenchmarkJob status..."
                kubectl get benchmarkjob $MODEL_NAME -n $NAMESPACE -o yaml || echo "BenchmarkJob not found"
                echo "Checking benchmark job events..."
                kubectl get events -n $NAMESPACE --sort-by=.metadata.creationTimestamp | grep -i benchmark | tail -10
              fi

              # Clean up benchmark job and inference service
              echo "🧹 Cleaning up resources for model: $model"
              kubectl delete -f benchmark-$MODEL_NAME.yaml || echo "Failed to delete benchmark job"

            else
              echo "❌ Failed to deploy or timeout waiting for InferenceService: $model"
              echo "Checking InferenceService status..."
              kubectl get inferenceservice $MODEL_NAME -n $NAMESPACE -o yaml || echo "InferenceService not found"
              echo "Checking events in namespace..."
              kubectl get events -n $NAMESPACE --sort-by=.metadata.creationTimestamp | tail -10
              # Continue with next model instead of failing the entire workflow
            fi

            # Clean up inference service
            kubectl delete -f isvc-$MODEL_NAME.yaml || echo "Failed to delete inference service"

            # Clean up manifest files
            rm -f isvc-$MODEL_NAME.yaml
            rm -f benchmark-$MODEL_NAME.yaml

            echo "---"
          done


      - name: Create deployment summary
        run: |
          MODELS_JSON='${{ steps.models.outputs.models_json }}'
          VERSION="${{ steps.version_info.outputs.version }}"

          echo "## 🚀 SGLang Deployment & Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ steps.version_info.outputs.branch_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version_info.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.version_info.outputs.commit_hash }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image:** \`${{ steps.version_info.outputs.image_name }}:${{ steps.version_info.outputs.full_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📋 Deployment Overview" >> $GITHUB_STEP_SUMMARY
          echo "This workflow deployed and benchmarked each model sequentially:" >> $GITHUB_STEP_SUMMARY
          echo "1. **InferenceService Deployment** - Deploy SGLang runtime with the model" >> $GITHUB_STEP_SUMMARY
          echo "2. **Benchmark Execution** - Run performance benchmarks against the deployed service" >> $GITHUB_STEP_SUMMARY
          echo "3. **Resource Cleanup** - Clean up both InferenceService and BenchmarkJob after completion" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📊 Benchmarked Models" >> $GITHUB_STEP_SUMMARY
          echo "$MODELS_JSON" | jq -r '.[]' | while read -r model; do
            MODEL_NAME=$(echo "$model" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            # Use the same namespace calculation as in deployment step
            NAMESPACE=${K8S_NAMESPACE}
            NAMESPACE=$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g')
            NAMESPACE=$(echo "$NAMESPACE" | cut -c1-63 | sed 's/-$//')
            RUNTIME_NAME="srt-$MODEL_NAME"
            RUNTIME_NAME=$(echo "$RUNTIME_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g')
            RUNTIME_NAME=$(echo "$RUNTIME_NAME" | cut -c1-63 | sed 's/-$//')

            echo "- **Model:** \`$model\`" >> $GITHUB_STEP_SUMMARY
            echo "  - **Namespace:** \`$NAMESPACE\`" >> $GITHUB_STEP_SUMMARY
            echo "  - **InferenceService:** \`$MODEL_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "  - **Runtime:** \`$RUNTIME_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "  - **Benchmark Results:** \`oci://n/${REGISTRY_NAMESPACE}/b/${BUCKET_NAME}/o/${CONTAINER_NAME}/${{ steps.version_info.outputs.full_tag }}/$MODEL_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done

          echo "### ⚙️ Benchmark Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Engine:** SGLang" >> $GITHUB_STEP_SUMMARY
          echo "- **GPU Type:** H100" >> $GITHUB_STEP_SUMMARY
          echo "- **Task:** text-to-text" >> $GITHUB_STEP_SUMMARY
          echo "- **Benchmark Image:** \`${BENCHMARK_CONTAINER}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📈 Results Location" >> $GITHUB_STEP_SUMMARY
          echo "All benchmark results are stored in OCI Object Storage:" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket:** \`${BUCKET_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Path Pattern:** \`${CONTAINER_NAME}/${{ steps.version_info.outputs.full_tag }}/{model_name}/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Note: All resources (InferenceServices and BenchmarkJobs) were cleaned up after completion._" >> $GITHUB_STEP_SUMMARY
